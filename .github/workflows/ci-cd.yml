name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  API_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sporttrack-api
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/sporttrack-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Test & Build Backend
  # ─────────────────────────────────────────────────────────────────────────────
  test-backend:
    name: 🧪 Test .NET API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sporttrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore backend/SportTrack.Api/SportTrack.Api.csproj

      - name: Build
        run: dotnet build backend/SportTrack.Api/SportTrack.Api.csproj --no-restore -c Release

      - name: Run Tests
        run: dotnet test backend/SportTrack.Api/SportTrack.Api.csproj --no-build -c Release --logger trx
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=sporttrack_test;Username=postgres;Password=postgres"

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Test Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  test-frontend:
    name: 🧪 Test React App
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Tests
        run: npm test -- --watchAll=false --passWithNoTests
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          REACT_APP_API_URL: http://localhost:5000/api/v1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build & Push Docker Images (only on main)
  # ─────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git SHA tag
        id: meta
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build & push API image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/SportTrack.Api
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ steps.meta.outputs.SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.SHA }}
          build-args: |
            REACT_APP_API_URL=${{ secrets.API_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Deploy to Kubernetes (EKS on AWS)
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production         # requires manual approval in GitHub

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name sporttrack-cluster \
            --region ${{ secrets.AWS_REGION }}

      - name: Extract SHA
        id: meta
        run: echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Update image tags in k8s manifests
        run: |
          sed -i "s|YOUR_DOCKERHUB_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/base/api.yaml
          sed -i "s|YOUR_DOCKERHUB_USER|${{ secrets.DOCKERHUB_USERNAME }}|g" k8s/base/frontend.yaml
          sed -i "s/:latest/:${{ steps.meta.outputs.SHA }}/g" k8s/base/api.yaml
          sed -i "s/:latest/:${{ steps.meta.outputs.SHA }}/g" k8s/base/frontend.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -k k8s/base/

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/sporttrack-api -n sporttrack --timeout=120s
          kubectl rollout status deployment/sporttrack-frontend -n sporttrack --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods -n sporttrack
          kubectl get svc -n sporttrack
