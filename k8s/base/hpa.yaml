---
# Scale API pods based on CPU usage
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sporttrack-api-hpa
  namespace: sporttrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sporttrack-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sporttrack-frontend-hpa
  namespace: sporttrack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sporttrack-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
