---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sporttrack-frontend
  namespace: sporttrack
  labels:
    app: sporttrack-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sporttrack-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sporttrack-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKERHUB_USER/sporttrack-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: sporttrack-frontend-svc
  namespace: sporttrack
spec:
  selector:
    app: sporttrack-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP

---
# Ingress — exposes both frontend and API under one domain
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sporttrack-ingress
  namespace: sporttrack
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: nginx
  rules:
    - host: sporttrack.example.com       # change to your domain or AWS ALB DNS
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sporttrack-api-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sporttrack-frontend-svc
                port:
                  number: 80
