---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: sporttrack
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:5000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sporttrack-api
  namespace: sporttrack
  labels:
    app: sporttrack-api
spec:
  replicas: 2                    # 2 replicas for HA
  selector:
    matchLabels:
      app: sporttrack-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime deploys
  template:
    metadata:
      labels:
        app: sporttrack-api
    spec:
      containers:
        - name: api
          image: YOUR_DOCKERHUB_USER/sporttrack-api:latest   # replaced by CI/CD
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: DB_CONNECTION
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30

---
apiVersion: v1
kind: Secret
metadata:
  name: api-secret
  namespace: sporttrack
type: Opaque
stringData:
  DB_CONNECTION: "Host=postgres-svc;Database=sporttrack;Username=postgres;Password=postgres"

---
apiVersion: v1
kind: Service
metadata:
  name: sporttrack-api-svc
  namespace: sporttrack
spec:
  selector:
    app: sporttrack-api
  ports:
    - port: 80
      targetPort: 5000
  type: ClusterIP
