# ansible/inventory.ini
# Replace IPs with your actual EC2 instance IPs

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/sporttrack-key.pem
ansible_python_interpreter=/usr/bin/python3

[masters]
k8s-master ansible_host=10.0.1.10

[workers]
k8s-worker-1 ansible_host=10.0.1.11
k8s-worker-2 ansible_host=10.0.1.12

[k8s:children]
masters
workers

[db]
db-server ansible_host=10.0.1.20
